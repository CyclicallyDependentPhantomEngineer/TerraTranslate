name: Refresh Terraform catalog

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      module_details:
        description: Fetch detailed metadata for every Registry module
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: terraform-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Build catalog tool
        run: go build -o ./terra-translate .

      - name: Refresh provider schemas, modules, and mappings
        env:
          MODULE_DETAILS: ${{ github.event_name == 'schedule' || inputs.module_details }}
        run: |
          ./terra-translate catalog refresh \
            -output ./catalog \
            -modules=true \
            -module-limit=0 \
            -module-details="${MODULE_DETAILS}" \
            -detail-rps=10 \
            -overrides ./catalog-overrides.json

      - name: Verify catalog
        run: |
          ./terra-translate catalog status -catalog ./catalog
          go test ./...

      - name: Open catalog refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain -- catalog)" ]; then
            echo "Catalog is already current"
            exit 0
          fi
          branch="automation/terraform-catalog-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add catalog
          git commit -m "chore: refresh Terraform provider catalog"
          git push --set-upstream origin "${branch}"
          gh pr create \
            --title "chore: refresh Terraform provider catalog" \
            --body "Automated weekly refresh of pinned AWS, Google, and AzureRM schemas, Registry module metadata, and generated mapping candidates." \
            --base "${BASE_BRANCH}" \
            --head "${branch}"
